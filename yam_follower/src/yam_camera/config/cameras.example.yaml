# Public example configuration.
# Copy this file to cameras.local.yaml and add the real machine values there.
cameras:
  d405:
    device: /dev/yam_d405_color
    port: 5000
    gateway_port: 5100
  d455f:
    device: /dev/yam_d455f_color
    port: 5002
    gateway_port: 5102

video:
  width: 848
  height: 480
  fps: 60
  bitrate_kbps: 4000
  keyframe_interval: 60

network:
  # TEST-NET-1 example address. Replace it in cameras.local.yaml.
  leader_ip: 192.0.2.11
  # The WebRTC gateway runs on the follower NUC.
  gateway_host: 127.0.0.1
  rtp_payload_type: 96
  mtu: 1200
  jitter_buffer_ms: 30
