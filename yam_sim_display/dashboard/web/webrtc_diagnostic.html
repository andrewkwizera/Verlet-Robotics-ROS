<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YAM WebRTC gateway diagnostic</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #10141b; color: #e8edf4; }
    header { padding: 14px 18px; border-bottom: 1px solid #2a3342; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; font-size: 19px; }
    .pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #273244; font-size: 12px; }
    .pill.ok { background: #1d5138; }
    .pill.bad { background: #5a2630; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); gap: 16px; padding: 16px; }
    .card { background: #171d27; border: 1px solid #2a3342; border-radius: 10px; padding: 14px; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    h2 { margin: 0; font-size: 16px; }
    video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 6px; display: block; }
    .overlay { font-size: 12px; color: #9fb0c6; margin: 8px 0; min-height: 18px; }
    .metrics { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-size: 12px; margin: 10px 0 0; }
    .metrics dt { color: #8fa1b8; }
    .metrics dd { margin: 0; font-family: ui-monospace, monospace; overflow-wrap: anywhere; }
    button { margin-top: 10px; padding: 6px 11px; border: 1px solid #3a4a61; border-radius: 6px; background: #23304a; color: #e8edf4; cursor: pointer; }
    button:hover { background: #2d3d5c; }
    footer { padding: 10px 18px; color: #8fa1b8; border-top: 1px solid #2a3342; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>WebRTC gateway diagnostic</h1>
    <span id="session-state" class="pill">starting</span>
  </header>

  <main>
    <section class="card" id="card-d405">
      <div class="card-head">
        <h2>d405 <small>RTP · UDP 5000</small></h2>
        <span class="pill" id="state-d405">init</span>
      </div>
      <video id="video-d405" autoplay playsinline muted></video>
      <div class="overlay" id="overlay-d405">waiting for session</div>
      <dl class="metrics" id="metrics-d405"></dl>
      <button id="retry-d405" type="button">Retry d405 only</button>
    </section>

    <section class="card" id="card-d455f">
      <div class="card-head">
        <h2>d455f <small>RTP · UDP 5002</small></h2>
        <span class="pill" id="state-d455f">init</span>
      </div>
      <video id="video-d455f" autoplay playsinline muted></video>
      <div class="overlay" id="overlay-d455f">waiting for session</div>
      <dl class="metrics" id="metrics-d455f"></dl>
      <button id="retry-d455f" type="button">Retry d455f only</button>
    </section>
  </main>

  <footer>
    Independent feeds · H.264 passthrough · no transcoding
  </footer>

  <script src="webrtc_client.js"></script>
  <script src="webrtc_diagnostic.js"></script>
</body>
</html>
